name: Bootstrap Baseten registry secrets

on:
  workflow_dispatch:
    inputs:
      managed_eval_id:
        description: Stable eval ID that owns the configured Baseten team and secret name
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milk-baseten-registry-bootstrap-${{ vars.MILK_EVAL_ID }}
  cancel-in-progress: false

jobs:
  upsert-registry-secrets:
    name: Upsert Baseten GHCR credentials
    if: ${{ vars.MILK_EVAL_ID != '' && inputs.managed_eval_id == vars.MILK_EVAL_ID }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: milk-provider-jobs-prod
    env:
      MILK_EVAL_ID: ${{ vars.MILK_EVAL_ID }}
      MILK_GHCR_PULL_USERNAME: ${{ secrets.MILK_GHCR_PULL_USERNAME }}
      MILK_GHCR_PULL_TOKEN: ${{ secrets.MILK_GHCR_PULL_TOKEN }}
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
    steps:
      - name: Read exact configuration validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Bind the active eval
        shell: bash
        env:
          MILK_EVAL_CONFIG_JSON: ${{ vars.MILK_EVAL_CONFIG_JSON }}
        run: |
          set -euo pipefail
          root=$(mktemp -d "$RUNNER_TEMP/milk-baseten-bootstrap.XXXXXX")
          trap 'rm -rf -- "$root"' EXIT
          printf '%s' "$MILK_EVAL_CONFIG_JSON" >"$root/eval.json"
          python3 -m milk_harness.eval_config \
            --document "$root/eval.json" \
            --eval-id "$MILK_EVAL_ID" \
            --harness-source-commit "$GITHUB_SHA" \
            --root "$GITHUB_WORKSPACE" \
            --manifest-output "$root/manifest.json" \
            --gateway-config-output "$root/gateway.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upsert and verify registry secret metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          api_root = "https://api.baseten.co/v1"
          api_key = os.environ.pop("BASETEN_API_KEY", "")
          username = os.environ.pop("MILK_GHCR_PULL_USERNAME", "")
          token = os.environ.pop("MILK_GHCR_PULL_TOKEN", "")
          training_name = os.environ.get("MILK_BASETEN_REGISTRY_SECRET", "")
          team_name = os.environ.get("MILK_BASETEN_TEAM_NAME", "")
          winner_name = "DOCKER_REGISTRY_ghcr.io"
          if (
              not api_key
              or not username
              or not token
              or ":" in username
              or any(character in "\r\n" for value in (username, token) for character in value)
              or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]{0,127}", training_name)
              is None
              or training_name == winner_name
              or re.fullmatch(
                  r"[A-Za-z0-9](?:[A-Za-z0-9 ._-]{0,126}[A-Za-z0-9])?",
                  team_name,
              )
              is None
          ):
              raise SystemExit("Baseten registry bootstrap configuration is invalid")

          credential = f"{username}:{token}"

          def request(method, path, body=None):
              raw = None if body is None else json.dumps(
                  body,
                  allow_nan=False,
                  separators=(",", ":"),
              ).encode()
              headers = {
                  "Accept": "application/json",
                  "Authorization": f"Api-Key {api_key}",
              }
              if raw is not None:
                  headers["Content-Type"] = "application/json"
              call = urllib.request.Request(
                  api_root + path,
                  data=raw,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(call, timeout=30) as response:
                      result = response.read(1024 * 1024 + 1)
                      status = response.status
              except urllib.error.HTTPError as error:
                  raise SystemExit(
                      f"Baseten registry bootstrap failed with HTTP {error.code}"
                  ) from None
              except (TimeoutError, urllib.error.URLError):
                  raise SystemExit("Baseten registry bootstrap request failed") from None
              if status != 200 or not result or len(result) > 1024 * 1024:
                  raise SystemExit("Baseten registry bootstrap response is invalid")
              try:
                  value = json.loads(result)
              except (UnicodeDecodeError, json.JSONDecodeError):
                  raise SystemExit(
                      "Baseten registry bootstrap response is not JSON"
                  ) from None
              if not isinstance(value, dict):
                  raise SystemExit("Baseten registry bootstrap response is invalid")
              return value

          for name in (training_name, winner_name):
              response = request(
                  "POST",
                  "/secrets",
                  {"name": name, "value": credential},
              )
              if response.get("name") != name or response.get("team_name") != team_name:
                  raise SystemExit("Baseten registry secret scope differs")

          credential = ""
          metadata = request("GET", "/secrets")
          secrets = metadata.get("secrets")
          if not isinstance(secrets, list):
              raise SystemExit("Baseten secret metadata is invalid")
          for name in (training_name, winner_name):
              matches = [
                  item
                  for item in secrets
                  if isinstance(item, dict)
                  and item.get("name") == name
                  and item.get("team_name") == team_name
              ]
              if len(matches) != 1:
                  raise SystemExit("Baseten registry secret metadata is absent or ambiguous")
          PY
