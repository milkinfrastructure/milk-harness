name: offline-gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milk-harness-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11

      - name: Verify Python and provider contracts
        run: |
          python3 -m compileall -q milk_harness deploy
          python3 -m unittest discover -s milk_harness -p 'test_*.py'
          python3 -m unittest discover -s deploy/baseten -p 'test_*.py'
          python3 deploy/test_winner_admission.py
          python3 deploy/h100-fp8-runtime/test_runtime.py
          python3 deploy/student/test_runtime.py
          python3 deploy/teacher/gpt-oss-120b/test_runtime.py
          python3 deploy/adapter_train/test_contract.py
          python3 deploy/adapter_train/test_sft_entrypoint.py

      - name: Verify release scripts
        run: |
          shellcheck --version
          shellcheck -s sh \
            deploy/student-job.sh deploy/student-job.test.sh \
            deploy/build-images.sh deploy/build-images.test.sh \
            tools/exo/milk-managed tools/exo/milk-managed.test.sh \
            tools/exo/install-host-command
          sh deploy/student-job.test.sh
          sh deploy/build-images.test.sh
          sh tools/exo/milk-managed.test.sh
          node --test tools/exo/index.test.mjs

      - name: Write content-free CI receipt
        if: always()
        env:
          JOB_OUTCOME: ${{ job.status }}
        run: |
          install -d -m 0700 ci-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          value = {
              "schema_version": "milk.private-ci-ops-log-reference.v1",
              "repository_id": int(os.environ["GITHUB_REPOSITORY_ID"]),
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "job": "verify",
              "ops_log_authority": "private-github-actions-run",
              "ops_log_reference": (
                  f"github-actions://repositories/{os.environ['GITHUB_REPOSITORY_ID']}"
                  f"/runs/{os.environ['GITHUB_RUN_ID']}"
                  f"/attempts/{os.environ['GITHUB_RUN_ATTEMPT']}/jobs/verify"
              ),
              "immutable": True,
              "content_free_receipt": True,
              "outcome": os.environ["JOB_OUTCOME"],
          }
          Path("ci-evidence/receipt.json").write_text(
              json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Retain private CI receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: milk-harness-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-evidence/receipt.json
          if-no-files-found: error
          retention-days: 30
