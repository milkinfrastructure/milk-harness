name: offline-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: milk-harness-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11
          cache: "false"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.24.3
          cache: false

      - name: Verify Python and provider contracts
        run: |
          python3 -m compileall -q milk_harness deploy
          python3 -m unittest discover -s milk_harness -p 'test_*.py'
          python3 -m unittest discover -s deploy/baseten -p 'test_*.py'
          python3 -m unittest discover -s deploy/modal -p 'test_*.py'
          python3 deploy/h100-fp8-runtime/test_runtime.py
          python3 deploy/student/test_runtime.py
          python3 deploy/teacher/gpt-oss-120b/test_runtime.py
          python3 deploy/adapter_train/test_contract.py
          python3 deploy/adapter_train/test_sft_entrypoint.py

      - name: Verify Go and release scripts
        run: |
          go test ./...
          sh deploy/student-job.test.sh
          sh deploy/build-images.test.sh
