            exit 0
          fi

          if [ "$canary_action" = done ]; then
            zero_live=true
            printf 'zero_published=true\n' >>"$GITHUB_OUTPUT"
            printf 'zero_route_revision=%s\n' "$canary_revision" >>"$GITHUB_OUTPUT"
            reconcile_candidate absent || fail 'candidate credential absence is not durable' 70
            proof_evidence candidate require-any || fail 'completed route has no immutable candidate proof' 70
