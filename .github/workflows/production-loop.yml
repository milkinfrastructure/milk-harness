name: production run once

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Run the production watcher or the isolated mechanics proof
        type: choice
        options: [production, mechanics]
        default: production

permissions:
  contents: read

concurrency:
  group: milk-harness-run-once-production
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: milk-provider-jobs-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.12.11

      - name: Reconcile one closed-window pass
        env:
          MILK_HARNESS_REVISION: ${{ github.sha }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          MILK_GATEWAY_API_KEY: ${{ secrets.MILK_GATEWAY_API_KEY }}
          MILK_CONTROL_R2_ACCOUNT_ID: ${{ secrets.MILK_CONTROL_R2_ACCOUNT_ID }}
          MILK_CONTROL_R2_BUCKET: ${{ secrets.MILK_CONTROL_R2_BUCKET }}
          MILK_CONTROL_R2_ACCESS_KEY_ID: ${{ secrets.MILK_CONTROL_R2_ACCESS_KEY_ID }}
          MILK_CONTROL_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_CONTROL_R2_SECRET_ACCESS_KEY }}
          MILK_CONTROL_R2_SESSION_TOKEN: ${{ secrets.MILK_CONTROL_R2_SESSION_TOKEN }}
          MILK_RUN_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
        run: |
          set -eu
          command -v zstd >/dev/null
          case "$MILK_RUN_PROFILE" in
            production|mechanics) ;;
            *) exit 64 ;;
          esac
          python -m milk_harness run-once --config "deploy/run-once.${MILK_RUN_PROFILE}.json"
