name: Milk production loop
run-name: >-
  ${{ inputs.managed_request_id != '' &&
      format('Milk production loop [managed:{0}]', inputs.managed_request_id) ||
      'Milk production loop' }}

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:
    inputs:
      authorize_provider_creates:
        description: Confirm this run may create paid provider work
        required: true
        default: false
        type: boolean
      confirmed_run_config_sha256:
        description: Exact outer eval ID; retained name for Exo host compatibility
        required: false
        type: string
      managed_request_id:
        description: Host-generated correlation ID; never grants provider authority
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: milk-production-loop-v1-${{ vars.MILK_EVAL_ID }}
  cancel-in-progress: false
  queue: max

jobs:
  gateway-tick:
    name: Gateway tick
    if: >-
      ${{ vars.MILK_EVAL_ID != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.confirmed_run_config_sha256 == vars.MILK_EVAL_ID)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: milk-gateway-tick-prod
    outputs:
      summary_b64: ${{ steps.tick.outputs.summary_b64 }}
      accepted: ${{ steps.tick.outputs.accepted }}
    env:
      MILK_EVAL_ID: ${{ vars.MILK_EVAL_ID }}
      MILK_GHCR_PULL_USERNAME: ${{ secrets.MILK_GHCR_PULL_USERNAME }}
      MILK_GHCR_PULL_TOKEN: ${{ secrets.MILK_GHCR_PULL_TOKEN }}
      MILK_CAPTURE_STORE_ACCESS_KEY_ID: ${{ secrets.MILK_CAPTURE_STORE_ACCESS_KEY_ID }}
      MILK_CAPTURE_STORE_SECRET_ACCESS_KEY: ${{ secrets.MILK_CAPTURE_STORE_SECRET_ACCESS_KEY }}
      MILK_CAPTURE_STORE_SESSION_TOKEN: ${{ secrets.MILK_CAPTURE_STORE_SESSION_TOKEN }}
      MILK_CONTROL_STORE_ACCESS_KEY_ID: ${{ secrets.MILK_CONTROL_STORE_ACCESS_KEY_ID }}
      MILK_CONTROL_STORE_SECRET_ACCESS_KEY: ${{ secrets.MILK_CONTROL_STORE_SECRET_ACCESS_KEY }}
      MILK_CONTROL_STORE_SESSION_TOKEN: ${{ secrets.MILK_CONTROL_STORE_SESSION_TOKEN }}
      MILK_PROVIDER_CREATE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true }}
      MILK_PROVIDER_CREATE_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && inputs.confirmed_run_config_sha256 || '' }}
    steps:
      - name: Read scheduler code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize active eval
        id: eval
        shell: bash
        env:
          MILK_EVAL_CONFIG_JSON: ${{ vars.MILK_EVAL_CONFIG_JSON }}
        run: |
          set -euo pipefail
          eval_root=$(mktemp -d "$RUNNER_TEMP/milk-eval.XXXXXX")
          printf '%s' "$MILK_EVAL_CONFIG_JSON" >"$eval_root/eval.json"
          python3 -m milk_harness.eval_config \
            --document "$eval_root/eval.json" \
            --eval-id "$MILK_EVAL_ID" \
            --harness-source-commit "$GITHUB_SHA" \
            --root "$GITHUB_WORKSPACE" \
            --manifest-output "$eval_root/manifest.json" \
            --gateway-config-output "$eval_root/gateway.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run one gateway tick
        id: tick
        shell: bash
        run: |
          set -euo pipefail
          fail() {
            printf 'gateway tick: %s\n' "$1" >&2
            exit "${2:-64}"
          }
          [ -n "$MILK_GHCR_PULL_USERNAME" ] || fail 'private registry username is missing'
          [ -n "$MILK_GHCR_PULL_TOKEN" ] || fail 'private registry token is missing'
          python3 -m milk_harness.scheduler validate-image \
            --name gateway --image "$MILK_GATEWAY_IMAGE"
          python3 -m milk_harness.scheduler validate-confirmation \
            --requested "$MILK_PROVIDER_CREATE_REQUESTED" \
            --provided-sha256 "$MILK_PROVIDER_CREATE_CONFIRMATION" \
            --expected-sha256 "$MILK_EVAL_ID"

          scratch=$(mktemp -d "$RUNNER_TEMP/milk-gateway-tick.XXXXXX")
          cleanup() {
            case "$scratch" in
              "$RUNNER_TEMP"/milk-gateway-tick.*) sudo rm -rf -- "$scratch" ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM
          docker_config=$scratch/docker
          config=$MILK_GATEWAY_CONFIG_PATH
          run_config=$MILK_CONFIRMED_RUN_CONFIG_PATH
          stdout=$scratch/stdout
          stderr=$scratch/stderr
          mkdir -m 0700 "$docker_config"
          python3 -m milk_harness.scheduler validate-run-config \
            --phase gateway \
            --manifest "$run_config" \
            --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
            --harness-source-commit "$GITHUB_SHA" \
            --gateway-config "$config" \
            --gateway-image "$MILK_GATEWAY_IMAGE"
          chmod 0400 "$config"
          sudo chown 65532:65532 "$config"

          if ! printf '%s' "$MILK_GHCR_PULL_TOKEN" | docker --config "$docker_config" login \
            ghcr.io --username "$MILK_GHCR_PULL_USERNAME" --password-stdin >/dev/null 2>&1; then
            fail 'private registry login failed' 77
          fi
          if ! docker --config "$docker_config" pull "$MILK_GATEWAY_IMAGE" >/dev/null 2>&1; then
            fail 'exact private gateway image pull failed' 69
          fi
          docker --config "$docker_config" image inspect "$MILK_GATEWAY_IMAGE" >/dev/null 2>&1 || \
            fail 'exact private gateway image is absent after pull' 69

          started_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          set +e
          docker --config "$docker_config" run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 \
            --memory 1g \
            --cpus 1 \
            -e MILK_CAPTURE_STORE_ACCESS_KEY_ID \
            -e MILK_CAPTURE_STORE_SECRET_ACCESS_KEY \
            -e MILK_CAPTURE_STORE_SESSION_TOKEN \
            -e MILK_CONTROL_STORE_ACCESS_KEY_ID \
            -e MILK_CONTROL_STORE_SECRET_ACCESS_KEY \
            -e MILK_CONTROL_STORE_SESSION_TOKEN \
            --mount "type=bind,source=$config,target=/run/secrets/config.json,readonly" \
            "$MILK_GATEWAY_IMAGE" --config /run/secrets/config.json tick --once \
            >"$stdout" 2>"$stderr"
          status=$?
          set -e
          completed_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          python3 -m milk_harness.scheduler summarize \
            --source gateway \
            --stdout "$stdout" \
            --stderr "$stderr" \
            --exit-code "$status" \
            --started-at "$started_at" \
            --completed-at "$completed_at" \
            --output "$scratch/summary.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require an accepted gateway result
        if: ${{ steps.tick.outputs.accepted != 'true' }}
        shell: bash
        run: exit 1

  provider-jobs:
    name: Provider reconciliation and dispatch
    needs: gateway-tick
    if: >-
      ${{ always() &&
          vars.MILK_EVAL_ID != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.confirmed_run_config_sha256 == vars.MILK_EVAL_ID)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: milk-provider-jobs-prod
    outputs:
      route_required: ${{ steps.provider.outputs.route_required }}
      route_candidate_ready: ${{ steps.provider.outputs.route_candidate_ready }}
      route_student_job_id: ${{ steps.provider.outputs.route_student_job_id }}
    env:
      MILK_EVAL_ID: ${{ vars.MILK_EVAL_ID }}
      MILK_GHCR_PULL_USERNAME: ${{ secrets.MILK_GHCR_PULL_USERNAME }}
      MILK_GHCR_PULL_TOKEN: ${{ secrets.MILK_GHCR_PULL_TOKEN }}
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MILK_CONTROL_R2_ACCESS_KEY_ID: ${{ secrets.MILK_CONTROL_R2_ACCESS_KEY_ID }}
      MILK_CONTROL_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_CONTROL_R2_SECRET_ACCESS_KEY }}
      MILK_CONTROL_R2_SESSION_TOKEN: ${{ secrets.MILK_CONTROL_R2_SESSION_TOKEN }}
      MILK_EVIDENCE_R2_ACCESS_KEY_ID: ${{ secrets.MILK_EVIDENCE_R2_ACCESS_KEY_ID }}
      MILK_EVIDENCE_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_EVIDENCE_R2_SECRET_ACCESS_KEY }}
      MILK_EVIDENCE_R2_SESSION_TOKEN: ${{ secrets.MILK_EVIDENCE_R2_SESSION_TOKEN }}
      MILK_CREATE_AUTHORITY_WRITE_R2_ACCESS_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_WRITE_R2_ACCESS_KEY_ID || '' }}
      MILK_CREATE_AUTHORITY_WRITE_R2_SECRET_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_WRITE_R2_SECRET_ACCESS_KEY || '' }}
      MILK_CREATE_AUTHORITY_WRITE_R2_SESSION_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_WRITE_R2_SESSION_TOKEN || '' }}
      MILK_CREATE_AUTHORITY_READ_R2_ACCESS_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_READ_R2_ACCESS_KEY_ID || '' }}
      MILK_CREATE_AUTHORITY_READ_R2_SECRET_ACCESS_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_READ_R2_SECRET_ACCESS_KEY || '' }}
      MILK_CREATE_AUTHORITY_READ_R2_SESSION_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && needs.gateway-tick.outputs.accepted == 'true' && secrets.MILK_CREATE_AUTHORITY_READ_R2_SESSION_TOKEN || '' }}
      MILK_OPS_LOG_R2_ACCESS_KEY_ID: ${{ secrets.MILK_OPS_LOG_R2_ACCESS_KEY_ID }}
      MILK_OPS_LOG_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_OPS_LOG_R2_SECRET_ACCESS_KEY }}
      MILK_OPS_LOG_R2_SESSION_TOKEN: ${{ secrets.MILK_OPS_LOG_R2_SESSION_TOKEN }}
      MILK_GATEWAY_INGEST_CONTROL_R2_ACCESS_KEY_ID: ${{ secrets.MILK_GATEWAY_INGEST_CONTROL_R2_ACCESS_KEY_ID }}
      MILK_GATEWAY_INGEST_CONTROL_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_GATEWAY_INGEST_CONTROL_R2_SECRET_ACCESS_KEY }}
      MILK_GATEWAY_INGEST_CONTROL_R2_SESSION_TOKEN: ${{ secrets.MILK_GATEWAY_INGEST_CONTROL_R2_SESSION_TOKEN }}
      MILK_GATEWAY_INGEST_ROUTE_R2_ACCESS_KEY_ID: ${{ secrets.MILK_GATEWAY_INGEST_ROUTE_R2_ACCESS_KEY_ID }}
      MILK_GATEWAY_INGEST_ROUTE_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_GATEWAY_INGEST_ROUTE_R2_SECRET_ACCESS_KEY }}
      MILK_GATEWAY_INGEST_ROUTE_R2_SESSION_TOKEN: ${{ secrets.MILK_GATEWAY_INGEST_ROUTE_R2_SESSION_TOKEN }}
      GATEWAY_JOB_RESULT: ${{ needs.gateway-tick.result }}
      GATEWAY_SUMMARY_B64: ${{ needs.gateway-tick.outputs.summary_b64 }}
      GATEWAY_SUMMARY_ACCEPTED: ${{ needs.gateway-tick.outputs.accepted }}
      MILK_GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
      MILK_PROVIDER_CREATE_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true }}
      MILK_PROVIDER_CREATE_CONFIRMATION: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && inputs.confirmed_run_config_sha256 || '' }}
    steps:
      - name: Read scheduler code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize active eval
        id: eval
        shell: bash
        env:
          MILK_EVAL_CONFIG_JSON: ${{ vars.MILK_EVAL_CONFIG_JSON }}
        run: |
          set -euo pipefail
          eval_root=$(mktemp -d "$RUNNER_TEMP/milk-eval.XXXXXX")
          printf '%s' "$MILK_EVAL_CONFIG_JSON" >"$eval_root/eval.json"
          python3 -m milk_harness.eval_config \
            --document "$eval_root/eval.json" \
            --eval-id "$MILK_EVAL_ID" \
            --harness-source-commit "$GITHUB_SHA" \
            --root "$GITHUB_WORKSPACE" \
            --manifest-output "$eval_root/manifest.json" \
            --gateway-config-output "$eval_root/gateway.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Read exact gateway credential helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: milkinfrastructure/milk-gateway
          ref: ${{ steps.eval.outputs.gateway_source_commit }}
          path: milk-gateway-source
          token: ${{ secrets.MILK_GATEWAY_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Reconcile, conditionally dispatch, and archive the pass
        id: provider
        shell: bash
        env:
          CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN: ${{ secrets.CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN }}
          MILK_GATEWAY_CONTAINER_ADMIN_KEY: ${{ secrets.MILK_GATEWAY_CONTAINER_ADMIN_KEY }}
        run: |
          set -euo pipefail
          fail() {
            printf 'provider jobs: %s\n' "$1" >&2
            exit "${2:-64}"
          }
          [ -n "$MILK_GHCR_PULL_USERNAME" ] || fail 'private registry username is missing'
          [ -n "$MILK_GHCR_PULL_TOKEN" ] || fail 'private registry token is missing'
          [ -n "$MILK_BASETEN_TEAM_NAME" ] || fail 'provider team is missing'
          [[ "$MILK_GATEWAY_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'gateway source commit is invalid'
          [ -n "$CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN" ] || fail 'candidate secret credential is missing'
          [ -n "$MILK_GATEWAY_CONTAINER_ADMIN_KEY" ] || fail 'container admin key is missing'
          python3 -m milk_harness.scheduler validate-images \
            --gateway-image "$MILK_GATEWAY_IMAGE" \
            --jobs-image "$MILK_JOBS_IMAGE" \
            --student-train-image "$MILK_STUDENT_TRAIN_IMAGE" \
            --student-branch-image "$MILK_STUDENT_BRANCH_IMAGE" \
            --teacher-image "$MILK_TEACHER_IMAGE" \
            --image-release-sha256 "$MILK_IMAGE_RELEASE_SHA256"

          scratch=$(mktemp -d "$RUNNER_TEMP/milk-provider-jobs.XXXXXX")
          candidate_socket_dir=$(mktemp -d "/tmp/milk-candidate-runtime.XXXXXX")
          lease_token=$scratch/provider-lease-token.json
          lease_container_token=/run/milk-provider-lease-token.json
          candidate_helper_pid=
          cleanup() {
            if [ -n "$candidate_helper_pid" ]; then
              if kill -0 "$candidate_helper_pid" 2>/dev/null; then
                kill -TERM "$candidate_helper_pid" 2>/dev/null || true
              fi
              wait "$candidate_helper_pid" 2>/dev/null || true
              candidate_helper_pid=
            fi
            if [ -f "$lease_token" ]; then
              python3 -m milk_harness.scheduler lease-release \
                --token "$lease_token" >/dev/null 2>&1 || true
            fi
            case "$scratch" in
              "$RUNNER_TEMP"/milk-provider-jobs.*) sudo rm -rf -- "$scratch" ;;
            esac
            case "$candidate_socket_dir" in
              /tmp/milk-candidate-runtime.*) sudo rm -rf -- "$candidate_socket_dir" ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM
          docker_config=$scratch/docker
          stdout=$scratch/stdout
          stderr=$scratch/stderr
          summary=$scratch/summary.json
          create_gate=$scratch/create-gate.json
          run_config=$MILK_CONFIRMED_RUN_CONFIG_PATH
          gateway_ingest_dir=$scratch/gateway-ingest
          gateway_ingest_manifest=$scratch/gateway-ingest-manifest.json
          gateway_ingest_entries=$scratch/gateway-ingest-entries
          gateway_ingest_config=$MILK_GATEWAY_CONFIG_PATH
          gateway_ingest_run_config=$MILK_CONFIRMED_RUN_CONFIG_PATH
          provider_gateway_config=$MILK_GATEWAY_CONFIG_PATH
          provider_gateway_run_config=$MILK_CONFIRMED_RUN_CONFIG_PATH
          gateway_ingest_stdout=$scratch/gateway-ingest-stdout
          gateway_ingest_stderr=$scratch/gateway-ingest-stderr
          candidate_socket=$candidate_socket_dir/milk-candidate-key.sock
          candidate_container_socket=/run/milk-candidate-key.sock
          candidate_helper_stdout=$scratch/candidate-helper-stdout
          candidate_helper_stderr=$scratch/candidate-helper-stderr
          gateway_source=$GITHUB_WORKSPACE/milk-gateway-source
          mkdir -m 0700 "$docker_config"
          mkdir -m 0700 "$scratch/npm-home"
          sudo chown 65532:65532 "$candidate_socket_dir"
          pass_id=$(python3 -m milk_harness.scheduler pass-id \
            --repository-id "$MILK_GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT")
          python3 -m milk_harness.scheduler validate-run-config \
            --phase provider_base \
            --manifest "$provider_gateway_run_config" \
            --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
            --harness-source-commit "$GITHUB_SHA" \
            --root "$GITHUB_WORKSPACE"
          env -i HOME="$scratch/npm-home" PATH=/usr/bin:/bin PYTHONPATH="$GITHUB_WORKSPACE" \
            python3 -m milk_harness.scheduler validate-run-config \
              --phase gateway_anchor \
              --manifest "$provider_gateway_run_config" \
              --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
              --harness-source-commit "$GITHUB_SHA" \
              --root "$GITHUB_WORKSPACE" \
              --gateway-config "$provider_gateway_config" \
              --gateway-image "$MILK_GATEWAY_IMAGE" \
              --gateway-source-commit "$MILK_GATEWAY_SOURCE_COMMIT" \
              --gateway-image-admission-sha256 "$MILK_GATEWAY_IMAGE_ADMISSION_SHA256" \
              --gateway-release-sha256 "$MILK_GATEWAY_RELEASE_SHA256" \
              --gateway-container-application-id "$MILK_GATEWAY_CONTAINER_APPLICATION_ID" \
              --gateway-container-application-version "$MILK_GATEWAY_CONTAINER_APPLICATION_VERSION" \
              --gateway-container-image "$MILK_GATEWAY_CONTAINER_IMAGE" \
              --gateway-worker-version-id "$MILK_GATEWAY_WORKER_VERSION_ID"
          python3 -m milk_harness.scheduler validate-run-config \
            --phase gateway_ingest \
            --manifest "$provider_gateway_run_config" \
            --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
            --harness-source-commit "$GITHUB_SHA" \
            --gateway-config "$provider_gateway_config" \
            --gateway-image "$MILK_GATEWAY_IMAGE"
          confirmed_gpu_provider=$(python3 -c \
            'import json,sys; print(json.load(open(sys.argv[1]))["provider_runtime"]["gpu_provider"])' \
            "$provider_gateway_run_config")
          provider_credential_env=()
          case "$confirmed_gpu_provider" in
            baseten)
              [ -n "$BASETEN_API_KEY" ] || fail 'Baseten credential is missing'
              unset MODAL_TOKEN_ID MODAL_TOKEN_SECRET
              provider_credential_env=(-e BASETEN_API_KEY)
              ;;
            modal)
              [ -n "$MODAL_TOKEN_ID" ] || fail 'Modal credential is missing'
              [ -n "$MODAL_TOKEN_SECRET" ] || fail 'Modal credential is missing'
              unset BASETEN_API_KEY
              provider_credential_env=(-e MODAL_TOKEN_ID -e MODAL_TOKEN_SECRET)
              ;;
            *) fail 'confirmed eval GPU provider is invalid' ;;
          esac

          if ! printf '%s' "$MILK_GHCR_PULL_TOKEN" | docker --config "$docker_config" login \
            ghcr.io --username "$MILK_GHCR_PULL_USERNAME" --password-stdin >/dev/null 2>&1; then
            fail 'private registry login failed' 77
          fi
          if ! docker --config "$docker_config" pull "$MILK_JOBS_IMAGE" >/dev/null 2>&1; then
            fail 'exact private jobs image pull failed' 69
          fi
          docker --config "$docker_config" image inspect "$MILK_JOBS_IMAGE" >/dev/null 2>&1 || \
            fail 'exact private jobs image is absent after pull' 69
          if ! docker --config "$docker_config" pull "$MILK_GATEWAY_IMAGE" >/dev/null 2>&1; then
            fail 'exact private gateway image pull failed' 69
          fi
          gateway_image_commit=$(docker --config "$docker_config" image inspect \
            --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "$MILK_GATEWAY_IMAGE")
          [ "$gateway_image_commit" = "$MILK_GATEWAY_SOURCE_COMMIT" ] || \
            fail 'gateway helper source differs from the admitted image'
          [ "$(git -C "$gateway_source" rev-parse --verify HEAD)" = "$MILK_GATEWAY_SOURCE_COMMIT" ] || \
            fail 'gateway helper checkout differs from the admitted image'
          [ -f "$gateway_source/tools/manage-candidate-credential.py" ] && \
            [ ! -L "$gateway_source/tools/manage-candidate-credential.py" ] || \
            fail 'gateway candidate helper is missing'
          if ! env -i CI=1 HOME="$scratch/npm-home" PATH="$PATH" \
            npm ci --ignore-scripts --no-audit --no-fund \
              --prefix "$gateway_source/deploy/cloudflare" \
              >"$scratch/npm-stdout" 2>"$scratch/npm-stderr"; then
            : >"$scratch/npm-stdout"
            : >"$scratch/npm-stderr"
            fail 'exact gateway helper dependencies failed to install' 69
          fi
          : >"$scratch/npm-stdout"
          : >"$scratch/npm-stderr"

          job_arguments=(
            --campaign-id "$MILK_CAMPAIGN_ID"
            --project-id "$MILK_BASETEN_PROJECT_ID"
            --baseten-team-name "$MILK_BASETEN_TEAM_NAME"
            --gpu-provider "$confirmed_gpu_provider"
            --candidate-key-socket "$candidate_container_socket"
            --winner-model-alias "$MILK_WINNER_MODEL_ALIAS"
            --scope-prefix "$MILK_SCOPE_PREFIX"
            --lease-token "$lease_container_token"
            --student-train-image "$MILK_STUDENT_TRAIN_IMAGE"
            --student-branch-image "$MILK_STUDENT_BRANCH_IMAGE"
            --teacher-image "$MILK_TEACHER_IMAGE"
            --jobs-image "$MILK_JOBS_IMAGE"
            --image-release-sha256 "$MILK_IMAGE_RELEASE_SHA256"
            --registry-secret "$MILK_BASETEN_REGISTRY_SECRET"
            --config-secret "$MILK_BASETEN_CONFIG_SECRET"
            --capture-store-access-key-secret "$MILK_BASETEN_CAPTURE_ACCESS_SECRET"
            --capture-store-secret-key-secret "$MILK_BASETEN_CAPTURE_SECRET_SECRET"
            --control-store-access-key-secret "$MILK_BASETEN_CONTROL_ACCESS_SECRET"
            --control-store-secret-key-secret "$MILK_BASETEN_CONTROL_SECRET_SECRET"
            --modal-workspace-id "$MILK_MODAL_WORKSPACE_ID"
            --modal-workspace-name "$MILK_MODAL_WORKSPACE_NAME"
            --modal-environment-id "$MILK_MODAL_ENVIRONMENT_ID"
            --modal-environment-name "$MILK_MODAL_ENVIRONMENT_NAME"
            --modal-app-id "$MILK_MODAL_APP_ID"
            --modal-app-name "$MILK_MODAL_APP_NAME"
            --modal-registry-secret-name "$MILK_MODAL_REGISTRY_SECRET_NAME"
            --modal-registry-secret-id "$MILK_MODAL_REGISTRY_SECRET_ID"
            --modal-config-secret-name "$MILK_MODAL_CONFIG_SECRET_NAME"
            --modal-config-secret-id "$MILK_MODAL_CONFIG_SECRET_ID"
            --modal-control-secret-name "$MILK_MODAL_CONTROL_SECRET_NAME"
            --modal-control-secret-id "$MILK_MODAL_CONTROL_SECRET_ID"
            --modal-capture-secret-name "$MILK_MODAL_CAPTURE_SECRET_NAME"
            --modal-capture-secret-id "$MILK_MODAL_CAPTURE_SECRET_ID"
            --modal-candidate-secret-name "$MILK_MODAL_CANDIDATE_SECRET_NAME"
            --modal-candidate-secret-id "$MILK_MODAL_CANDIDATE_SECRET_ID"
            --modal-teacher-volume-name "$MILK_MODAL_TEACHER_VOLUME_NAME"
            --modal-teacher-volume-id "$MILK_MODAL_TEACHER_VOLUME_ID"
            --modal-student-train-volume-name "$MILK_MODAL_STUDENT_TRAIN_VOLUME_NAME"
            --modal-student-train-volume-id "$MILK_MODAL_STUDENT_TRAIN_VOLUME_ID"
          )
          if [ -n "$MILK_BASETEN_CAPTURE_SESSION_SECRET" ]; then
            job_arguments+=(--capture-store-session-token-secret "$MILK_BASETEN_CAPTURE_SESSION_SECRET")
          fi
          if [ -n "$MILK_BASETEN_CONTROL_SESSION_SECRET" ]; then
            job_arguments+=(--control-store-session-token-secret "$MILK_BASETEN_CONTROL_SESSION_SECRET")
          fi
          python3 -m milk_harness.scheduler create-gate \
            --event "$GITHUB_EVENT_NAME" \
            --requested "$MILK_PROVIDER_CREATE_REQUESTED" \
            --provided-sha256 "$MILK_PROVIDER_CREATE_CONFIRMATION" \
            --expected-sha256 "$MILK_EVAL_ID" \
            --gateway-result "$GATEWAY_JOB_RESULT" \
            --gateway-accepted "$GATEWAY_SUMMARY_ACCEPTED" \
            --output "$create_gate"
          create_requested=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["requested"]).lower())' "$create_gate")
          confirmation_valid=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["confirmation_valid"]).lower())' "$create_gate")
          create_granted=$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["granted"]).lower())' "$create_gate")
          confirmation_for_receipt=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["confirmation_sha256"] or "")' "$create_gate")
          configuration_verified=false
          if [ "$create_granted" = true ]; then
            if python3 -m milk_harness.scheduler validate-run-config \
              --phase provider \
              --manifest "$run_config" \
              --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
              --harness-source-commit "$GITHUB_SHA" \
              --campaign-id "$MILK_CAMPAIGN_ID" \
              --provider-project-id "$MILK_BASETEN_PROJECT_ID" \
              --gpu-provider "$confirmed_gpu_provider" \
              --baseten-team-name "$MILK_BASETEN_TEAM_NAME" \
              --winner-model-alias "$MILK_WINNER_MODEL_ALIAS" \
              --scope-prefix "$MILK_SCOPE_PREFIX" \
              --gateway-image "$MILK_GATEWAY_IMAGE" \
              --jobs-image "$MILK_JOBS_IMAGE" \
              --student-train-image "$MILK_STUDENT_TRAIN_IMAGE" \
              --student-branch-image "$MILK_STUDENT_BRANCH_IMAGE" \
              --teacher-image "$MILK_TEACHER_IMAGE" \
              --image-release-sha256 "$MILK_IMAGE_RELEASE_SHA256" \
              --gateway-source-commit "$MILK_GATEWAY_SOURCE_COMMIT" \
              --gateway-image-admission-sha256 "$MILK_GATEWAY_IMAGE_ADMISSION_SHA256" \
              --gateway-release-sha256 "$MILK_GATEWAY_RELEASE_SHA256" \
              --gateway-container-application-id "$MILK_GATEWAY_CONTAINER_APPLICATION_ID" \
              --gateway-container-application-version "$MILK_GATEWAY_CONTAINER_APPLICATION_VERSION" \
              --gateway-container-image "$MILK_GATEWAY_CONTAINER_IMAGE" \
              --gateway-worker-version-id "$MILK_GATEWAY_WORKER_VERSION_ID" \
              --registry-secret "$MILK_BASETEN_REGISTRY_SECRET" \
              --config-secret "$MILK_BASETEN_CONFIG_SECRET" \
              --capture-access-secret "$MILK_BASETEN_CAPTURE_ACCESS_SECRET" \
              --capture-secret-secret "$MILK_BASETEN_CAPTURE_SECRET_SECRET" \
              --capture-session-secret "$MILK_BASETEN_CAPTURE_SESSION_SECRET" \
              --control-access-secret "$MILK_BASETEN_CONTROL_ACCESS_SECRET" \
              --control-secret-secret "$MILK_BASETEN_CONTROL_SECRET_SECRET" \
              --control-session-secret "$MILK_BASETEN_CONTROL_SESSION_SECRET" \
              --modal-workspace-id "$MILK_MODAL_WORKSPACE_ID" \
              --modal-workspace-name "$MILK_MODAL_WORKSPACE_NAME" \
              --modal-environment-id "$MILK_MODAL_ENVIRONMENT_ID" \
              --modal-environment-name "$MILK_MODAL_ENVIRONMENT_NAME" \
              --modal-app-id "$MILK_MODAL_APP_ID" \
              --modal-app-name "$MILK_MODAL_APP_NAME" \
              --modal-registry-secret-name "$MILK_MODAL_REGISTRY_SECRET_NAME" \
              --modal-registry-secret-id "$MILK_MODAL_REGISTRY_SECRET_ID" \
              --modal-config-secret-name "$MILK_MODAL_CONFIG_SECRET_NAME" \
              --modal-config-secret-id "$MILK_MODAL_CONFIG_SECRET_ID" \
              --modal-control-secret-name "$MILK_MODAL_CONTROL_SECRET_NAME" \
              --modal-control-secret-id "$MILK_MODAL_CONTROL_SECRET_ID" \
              --modal-capture-secret-name "$MILK_MODAL_CAPTURE_SECRET_NAME" \
              --modal-capture-secret-id "$MILK_MODAL_CAPTURE_SECRET_ID" \
              --modal-candidate-secret-name "$MILK_MODAL_CANDIDATE_SECRET_NAME" \
              --modal-candidate-secret-id "$MILK_MODAL_CANDIDATE_SECRET_ID" \
              --modal-teacher-volume-name "$MILK_MODAL_TEACHER_VOLUME_NAME" \
              --modal-teacher-volume-id "$MILK_MODAL_TEACHER_VOLUME_ID" \
              --modal-student-train-volume-name "$MILK_MODAL_STUDENT_TRAIN_VOLUME_NAME" \
              --modal-student-train-volume-id "$MILK_MODAL_STUDENT_TRAIN_VOLUME_ID"; then
              configuration_verified=true
            else
              create_granted=false
            fi
          fi
          create_authority_env=()
          if [ "$create_granted" = true ]; then
            create_authority_env=(
              -e MILK_CREATE_AUTHORITY_READ_R2_ACCOUNT_ID
              -e MILK_CREATE_AUTHORITY_READ_R2_BUCKET
              -e MILK_CREATE_AUTHORITY_READ_R2_ACCESS_KEY_ID
              -e MILK_CREATE_AUTHORITY_READ_R2_SECRET_ACCESS_KEY
              -e MILK_CREATE_AUTHORITY_READ_R2_SESSION_TOKEN
            )
          else
            unset \
              MILK_CREATE_AUTHORITY_WRITE_R2_ACCOUNT_ID \
              MILK_CREATE_AUTHORITY_WRITE_R2_BUCKET \
              MILK_CREATE_AUTHORITY_WRITE_R2_ACCESS_KEY_ID \
              MILK_CREATE_AUTHORITY_WRITE_R2_SECRET_ACCESS_KEY \
              MILK_CREATE_AUTHORITY_WRITE_R2_SESSION_TOKEN \
              MILK_CREATE_AUTHORITY_READ_R2_ACCOUNT_ID \
              MILK_CREATE_AUTHORITY_READ_R2_BUCKET \
              MILK_CREATE_AUTHORITY_READ_R2_ACCESS_KEY_ID \
              MILK_CREATE_AUTHORITY_READ_R2_SECRET_ACCESS_KEY \
              MILK_CREATE_AUTHORITY_READ_R2_SESSION_TOKEN
          fi

          python3 -m milk_harness.scheduler lease-acquire \
            --campaign-id "$MILK_CAMPAIGN_ID" \
            --scope-prefix "$MILK_SCOPE_PREFIX" \
            --owner-id "$pass_id" \
            --create-gate "$create_gate" \
            --configuration-verified "$configuration_verified" \
            --output "$lease_token"

          helper_path="$gateway_source/tools/manage-candidate-credential.py"
          wrangler_dir="$gateway_source/deploy/cloudflare/node_modules/.bin"
          helper_path_env="$wrangler_dir:$(dirname "$(command -v node)"):$(dirname "$(command -v python3)"):$(dirname "$(command -v curl)"):$(dirname "$(command -v sleep)"):/usr/bin:/bin"
          candidate_admin_key=$MILK_GATEWAY_CONTAINER_ADMIN_KEY
          unset MILK_GATEWAY_CONTAINER_ADMIN_KEY
          printf '%s' "$candidate_admin_key" | \
            timeout --signal=TERM --kill-after=10s 600s \
            sudo -n -u '#65532' -- env -i \
              PATH="$helper_path_env" \
              CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" \
              CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN="$CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN" \
              sh -c 'exec 3<&0; exec "$@"' sh \
              python3 "$helper_path" serve-baseten \
                --socket-path "$candidate_socket" \
                --admin-key-fd 3 \
                --application-id "$MILK_GATEWAY_CONTAINER_APPLICATION_ID" \
                --expected-application-version "$MILK_GATEWAY_CONTAINER_APPLICATION_VERSION" \
                --expected-container-image "$MILK_GATEWAY_CONTAINER_IMAGE" \
                --expected-worker-version-id "$MILK_GATEWAY_WORKER_VERSION_ID" \
              >"$candidate_helper_stdout" 2>"$candidate_helper_stderr" &
          candidate_helper_pid=$!
          candidate_admin_key=
          unset candidate_admin_key CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN
          candidate_socket_ready=false
          for unused in $(seq 1 100); do
            if [ -S "$candidate_socket" ]; then
              candidate_socket_ready=true
              break
            fi
            kill -0 "$candidate_helper_pid" 2>/dev/null || break
            sleep 0.1
          done
          [ "$candidate_socket_ready" = true ] || fail 'candidate credential helper did not become ready' 70

          started_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          set +e
          docker --config "$docker_config" run --rm \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=128m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 2g \
            --cpus 2 \
            --mount "type=bind,src=$lease_token,dst=$lease_container_token,readonly" \
            --mount "type=bind,src=$candidate_socket,dst=$candidate_container_socket" \
            "${provider_credential_env[@]}" \
            -e MILK_CONTROL_R2_ACCOUNT_ID \
            -e MILK_CONTROL_R2_BUCKET \
            -e MILK_CONTROL_R2_ACCESS_KEY_ID \
            -e MILK_CONTROL_R2_SECRET_ACCESS_KEY \
            -e MILK_CONTROL_R2_SESSION_TOKEN \
            -e MILK_EVIDENCE_R2_ACCOUNT_ID \
            -e MILK_EVIDENCE_R2_BUCKET \
            -e MILK_EVIDENCE_R2_ACCESS_KEY_ID \
            -e MILK_EVIDENCE_R2_SECRET_ACCESS_KEY \
            -e MILK_EVIDENCE_R2_SESSION_TOKEN \
            "${create_authority_env[@]}" \
            "$MILK_JOBS_IMAGE" "${job_arguments[@]}" \
            >"$stdout" 2>"$stderr"
          status=$?
          set -e
          candidate_helper_status=0
          if kill -0 "$candidate_helper_pid" 2>/dev/null; then
            if [ -S "$candidate_socket" ]; then
              kill -TERM "$candidate_helper_pid" 2>/dev/null || true
              wait "$candidate_helper_pid" 2>/dev/null || true
            else
              wait "$candidate_helper_pid" || candidate_helper_status=$?
            fi
          else
            wait "$candidate_helper_pid" || candidate_helper_status=$?
          fi
          candidate_helper_pid=
          if [ "$candidate_helper_status" -ne 0 ]; then
            printf 'provider jobs: candidate credential handoff failed\n' >>"$stderr"
            [ "$status" -ne 0 ] || status=70
          fi
          : >"$candidate_helper_stdout"
          : >"$candidate_helper_stderr"
          if [ "$status" -eq 0 ]; then
            set +e
            (
              set -euo pipefail
              mkdir -m 0700 "$gateway_ingest_dir"
              python3 -m milk_harness.scheduler stage-gateway-ingest \
                --provider-result "$stdout" \
                --campaign-id "$MILK_CAMPAIGN_ID" \
                --scope-prefix "$MILK_SCOPE_PREFIX" \
                --output-dir "$gateway_ingest_dir" \
                --output "$gateway_ingest_manifest"
              python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); sys.stdout.write("".join("{}\t{}\n".format(entry["kind"], entry["file"]) for entry in value["entries"]))' \
                "$gateway_ingest_manifest" >"$gateway_ingest_entries"
              if [ ! -s "$gateway_ingest_entries" ]; then
                exit 0
              fi

              [ -n "$MILK_GATEWAY_INGEST_CONTROL_R2_ACCESS_KEY_ID" ]
              [ -n "$MILK_GATEWAY_INGEST_CONTROL_R2_SECRET_ACCESS_KEY" ]
              [ -n "$MILK_GATEWAY_INGEST_ROUTE_R2_ACCESS_KEY_ID" ]
              [ -n "$MILK_GATEWAY_INGEST_ROUTE_R2_SECRET_ACCESS_KEY" ]
              python3 -m milk_harness.scheduler validate-run-config \
                --phase gateway_ingest \
                --manifest "$gateway_ingest_run_config" \
                --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
                --harness-source-commit "$GITHUB_SHA" \
                --gateway-config "$gateway_ingest_config" \
                --gateway-image "$MILK_GATEWAY_IMAGE"
              sudo chown 65532:65532 "$gateway_ingest_config"

              docker --config "$docker_config" pull "$MILK_GATEWAY_IMAGE" >/dev/null 2>&1
              docker --config "$docker_config" image inspect "$MILK_GATEWAY_IMAGE" >/dev/null 2>&1
              while IFS=$'\t' read -r kind file; do
                [[ "$file" =~ ^[0-9]{2}-(winner|teardown)-[0-9a-f]{64}\.json$ ]]
                [ "$kind" = "${BASH_REMATCH[1]}" ]
                result=$gateway_ingest_dir/$file
                chmod 0600 "$result"
                sudo chown 65532:65532 "$result"
                if [ "$kind" = winner ]; then
                  MILK_CONTROL_STORE_ACCESS_KEY_ID="$MILK_GATEWAY_INGEST_CONTROL_R2_ACCESS_KEY_ID" \
                  MILK_CONTROL_STORE_SECRET_ACCESS_KEY="$MILK_GATEWAY_INGEST_CONTROL_R2_SECRET_ACCESS_KEY" \
                  MILK_CONTROL_STORE_SESSION_TOKEN="$MILK_GATEWAY_INGEST_CONTROL_R2_SESSION_TOKEN" \
                  timeout --signal=TERM --kill-after=10s 90s \
                  docker --config "$docker_config" run --rm \
                    --read-only \
                    --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
                    --cap-drop ALL \
                    --security-opt no-new-privileges \
                    --pids-limit 128 \
                    --memory 1g \
                    --cpus 1 \
                    -e MILK_CONTROL_STORE_ACCESS_KEY_ID \
                    -e MILK_CONTROL_STORE_SECRET_ACCESS_KEY \
                    -e MILK_CONTROL_STORE_SESSION_TOKEN \
                    --mount "type=bind,source=$gateway_ingest_config,target=/run/secrets/config.json,readonly" \
                    --mount "type=bind,source=$result,target=/run/secrets/result.json,readonly" \
                    "$MILK_GATEWAY_IMAGE" --config /run/secrets/config.json \
                    ingest-student-winner-deployment-result --result /run/secrets/result.json \
                    >"$gateway_ingest_stdout" 2>"$gateway_ingest_stderr"
                else
                  MILK_CONTROL_STORE_ACCESS_KEY_ID="$MILK_GATEWAY_INGEST_CONTROL_R2_ACCESS_KEY_ID" \
                  MILK_CONTROL_STORE_SECRET_ACCESS_KEY="$MILK_GATEWAY_INGEST_CONTROL_R2_SECRET_ACCESS_KEY" \
                  MILK_CONTROL_STORE_SESSION_TOKEN="$MILK_GATEWAY_INGEST_CONTROL_R2_SESSION_TOKEN" \
                  MILK_ROUTE_STORE_ACCESS_KEY_ID="$MILK_GATEWAY_INGEST_ROUTE_R2_ACCESS_KEY_ID" \
                  MILK_ROUTE_STORE_SECRET_ACCESS_KEY="$MILK_GATEWAY_INGEST_ROUTE_R2_SECRET_ACCESS_KEY" \
                  MILK_ROUTE_STORE_SESSION_TOKEN="$MILK_GATEWAY_INGEST_ROUTE_R2_SESSION_TOKEN" \
                  timeout --signal=TERM --kill-after=10s 90s \
                  docker --config "$docker_config" run --rm \
                    --read-only \
                    --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
                    --cap-drop ALL \
                    --security-opt no-new-privileges \
                    --pids-limit 128 \
                    --memory 1g \
                    --cpus 1 \
                    -e MILK_CONTROL_STORE_ACCESS_KEY_ID \
                    -e MILK_CONTROL_STORE_SECRET_ACCESS_KEY \
                    -e MILK_CONTROL_STORE_SESSION_TOKEN \
                    -e MILK_ROUTE_STORE_ACCESS_KEY_ID \
                    -e MILK_ROUTE_STORE_SECRET_ACCESS_KEY \
                    -e MILK_ROUTE_STORE_SESSION_TOKEN \
                    --mount "type=bind,source=$gateway_ingest_config,target=/run/secrets/config.json,readonly" \
                    --mount "type=bind,source=$result,target=/run/secrets/result.json,readonly" \
                    "$MILK_GATEWAY_IMAGE" --config /run/secrets/config.json \
                    ingest-provider-teardown-result --result /run/secrets/result.json \
                    >"$gateway_ingest_stdout" 2>"$gateway_ingest_stderr"
                fi
                : >"$gateway_ingest_stdout"
                : >"$gateway_ingest_stderr"
              done <"$gateway_ingest_entries"
            )
            ingest_status=$?
            set -e
            : >"$gateway_ingest_stdout"
            : >"$gateway_ingest_stderr"
            if [ "$ingest_status" -ne 0 ]; then
              printf 'provider jobs: gateway result handoff failed\n' >>"$stderr"
              status=$ingest_status
            fi
          fi
          completed_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          python3 -m milk_harness.scheduler summarize \
            --source provider_jobs \
            --stdout "$stdout" \
            --stderr "$stderr" \
            --exit-code "$status" \
            --started-at "$started_at" \
            --completed-at "$completed_at" \
            --output "$summary"

          route_required=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); fields=value.get("accepted_fields") or {}; print(str(fields.get("winner_result_count", 0) == 1).lower())' "$summary")
          route_candidate_ready=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); fields=value.get("accepted_fields") or {}; print(str(fields.get("winner_result_count", 0) == 1 and fields.get("candidate_key_delivery_count", 0) == 1).lower())' "$summary")
          route_student_job_id=$(python3 -c 'import json,sys; value=json.load(open(sys.argv[1])); references=value.get("winner_result_references") or []; print(references[0]["student_job_id"] if len(references) == 1 else "")' "$stdout")
          if [ "$route_required" = true ]; then
            [[ "$route_student_job_id" =~ ^[0-9a-f]{64}$ ]] || fail 'route trigger identity is invalid'
          else
            [ -z "$route_student_job_id" ] || fail 'route trigger identity is unexpected'
          fi
          printf 'route_required=%s\n' "$route_required" >>"$GITHUB_OUTPUT"
          printf 'route_candidate_ready=%s\n' "$route_candidate_ready" >>"$GITHUB_OUTPUT"
          printf 'route_student_job_id=%s\n' "$route_student_job_id" >>"$GITHUB_OUTPUT"

          python3 -m milk_harness.scheduler archive \
            --repository-id "$MILK_GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" \
            --gateway-summary-b64 "$GATEWAY_SUMMARY_B64" \
            --provider-summary "$summary" \
            --gateway-image "$MILK_GATEWAY_IMAGE" \
            --jobs-image "$MILK_JOBS_IMAGE" \
            --student-train-image "$MILK_STUDENT_TRAIN_IMAGE" \
            --student-branch-image "$MILK_STUDENT_BRANCH_IMAGE" \
            --teacher-image "$MILK_TEACHER_IMAGE" \
            --image-release-sha256 "$MILK_IMAGE_RELEASE_SHA256" \
            --campaign-id "$MILK_CAMPAIGN_ID" \
            --lease-token "$lease_token" \
            --provider-create-requested "$create_requested" \
            --provider-confirmation-valid "$confirmation_valid" \
            --provider-configuration-verified "$configuration_verified" \
            --provider-create-granted "$create_granted" \
            --confirmation-sha256 "$confirmation_for_receipt" \
            --expected-confirmation-sha256 "$MILK_EVAL_ID" \
            >/dev/null

          python3 -m milk_harness.scheduler lease-release --token "$lease_token"
          rm -f -- "$lease_token"

          summary_state=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["state"])' "$summary")
          [ "$status" -eq 0 ] || exit "$status"
          [ "$summary_state" = succeeded ] || exit 65
          if [ "$create_requested" = true ] && [ "$confirmation_valid" != true ]; then
            fail 'paid provider create confirmation is invalid'
          fi
          if [ "$confirmation_valid" = true ] && [ "$configuration_verified" != true ]; then
            fail 'confirmed run configuration differs from the actual run'
          fi

  route-control:
    name: Winner canary and zero route
    needs: provider-jobs
    if: >-
      ${{ needs.provider-jobs.result == 'success' &&
          needs.provider-jobs.outputs.route_required == 'true' &&
          vars.MILK_EVAL_ID != '' &&
          (github.event_name == 'schedule' ||
           (github.event_name == 'workflow_dispatch' &&
            inputs.confirmed_run_config_sha256 == vars.MILK_EVAL_ID)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: milk-route-control-prod
    outputs:
      zero_published: ${{ steps.route.outputs.zero_published }}
      zero_route_revision: ${{ steps.route.outputs.zero_route_revision }}
    env:
      MILK_EVAL_ID: ${{ vars.MILK_EVAL_ID }}
      MILK_ROUTE_CANDIDATE_READY: ${{ needs.provider-jobs.outputs.route_candidate_ready }}
      MILK_ROUTE_STUDENT_JOB_ID: ${{ needs.provider-jobs.outputs.route_student_job_id }}
      MILK_ROUTE_PAID_PROOF_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true }}
    steps:
      - name: Read scheduler code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Materialize active eval
        id: eval
        shell: bash
        env:
          MILK_EVAL_CONFIG_JSON: ${{ vars.MILK_EVAL_CONFIG_JSON }}
        run: |
          set -euo pipefail
          eval_root=$(mktemp -d "$RUNNER_TEMP/milk-eval.XXXXXX")
          printf '%s' "$MILK_EVAL_CONFIG_JSON" >"$eval_root/eval.json"
          python3 -m milk_harness.eval_config \
            --document "$eval_root/eval.json" \
            --eval-id "$MILK_EVAL_ID" \
            --harness-source-commit "$GITHUB_SHA" \
            --root "$GITHUB_WORKSPACE" \
            --manifest-output "$eval_root/manifest.json" \
            --gateway-config-output "$eval_root/gateway.json" \
            --github-env "$GITHUB_ENV" \
            --github-output "$GITHUB_OUTPUT"

      - name: Read exact gateway route tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: milkinfrastructure/milk-gateway
          ref: ${{ steps.eval.outputs.gateway_source_commit }}
          path: milk-gateway-source
          token: ${{ secrets.MILK_GATEWAY_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Publish one canary, prove it, and publish zero
        id: route
        shell: bash
        env:
          MILK_GHCR_PULL_USERNAME: ${{ secrets.MILK_GHCR_PULL_USERNAME }}
          MILK_GHCR_PULL_TOKEN: ${{ secrets.MILK_GHCR_PULL_TOKEN }}
          MILK_ROUTE_SECRET_HEX: ${{ secrets.MILK_ROUTE_SECRET_HEX }}
          MILK_ROUTE_SIGNING_KEY_PEM: ${{ secrets.MILK_ROUTE_SIGNING_KEY_PEM }}
          MILK_ROUTE_SMOKE_CREDENTIAL_JSON: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && secrets.MILK_ROUTE_SMOKE_CREDENTIAL_JSON || '' }}
          MILK_MODAL_CANDIDATE_API_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.authorize_provider_creates == true && secrets.MILK_MODAL_CANDIDATE_API_KEY || '' }}
          MILK_GATEWAY_CONTAINER_ADMIN_KEY: ${{ secrets.MILK_GATEWAY_CONTAINER_ADMIN_KEY }}
          CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN: ${{ secrets.CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN }}
          MILK_CONTROL_STORE_ACCESS_KEY_ID: ${{ secrets.MILK_ROUTE_CONTROL_R2_ACCESS_KEY_ID }}
          MILK_CONTROL_STORE_SECRET_ACCESS_KEY: ${{ secrets.MILK_ROUTE_CONTROL_R2_SECRET_ACCESS_KEY }}
          MILK_CONTROL_STORE_SESSION_TOKEN: ${{ secrets.MILK_ROUTE_CONTROL_R2_SESSION_TOKEN }}
          MILK_ROUTE_STORE_ACCESS_KEY_ID: ${{ secrets.MILK_ROUTE_ROUTE_R2_ACCESS_KEY_ID }}
          MILK_ROUTE_STORE_SECRET_ACCESS_KEY: ${{ secrets.MILK_ROUTE_ROUTE_R2_SECRET_ACCESS_KEY }}
          MILK_ROUTE_STORE_SESSION_TOKEN: ${{ secrets.MILK_ROUTE_ROUTE_R2_SESSION_TOKEN }}
          MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID: ${{ secrets.MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID }}
          MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY: ${{ secrets.MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY }}
          MILK_ROUTE_EVIDENCE_R2_SESSION_TOKEN: ${{ secrets.MILK_ROUTE_EVIDENCE_R2_SESSION_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          fail() {
            printf 'route control: %s\n' "$1" >&2
            exit "${2:-64}"
          }
          [[ "$MILK_ROUTE_PAID_PROOF_AUTHORIZED" =~ ^(true|false)$ ]] || fail 'route proof authority flag is invalid' 70
          recovery_only=true
          [ "$MILK_ROUTE_PAID_PROOF_AUTHORIZED" != true ] || recovery_only=false
          [[ "$MILK_ROUTE_CANDIDATE_READY" =~ ^(true|false)$ ]] || fail 'candidate credential proof flag is invalid' 70
          [[ "$MILK_ROUTE_STUDENT_JOB_ID" =~ ^[0-9a-f]{64}$ ]] || fail 'student job identity is invalid'
          [[ "$MILK_GATEWAY_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || fail 'gateway source commit is invalid'
          python3 -m milk_harness.scheduler validate-image \
            --name gateway --image "$MILK_GATEWAY_IMAGE"

          for required in \
            MILK_GHCR_PULL_USERNAME MILK_GHCR_PULL_TOKEN \
            MILK_GATEWAY_CONFIG_PATH MILK_ROUTE_SECRET_HEX \
            MILK_ROUTE_SIGNING_KEY_PEM \
            MILK_CONTROL_STORE_ACCESS_KEY_ID MILK_CONTROL_STORE_SECRET_ACCESS_KEY \
            MILK_ROUTE_STORE_ACCESS_KEY_ID MILK_ROUTE_STORE_SECRET_ACCESS_KEY \
            MILK_CONFIRMED_RUN_CONFIG_SHA256 MILK_CONFIRMED_RUN_CONFIG_PATH \
            MILK_GATEWAY_IMAGE_ADMISSION_SHA256 MILK_GATEWAY_RELEASE_SHA256 \
            MILK_GATEWAY_CONTAINER_APPLICATION_ID \
            MILK_GATEWAY_CONTAINER_APPLICATION_VERSION \
            MILK_GATEWAY_CONTAINER_IMAGE MILK_GATEWAY_WORKER_VERSION_ID; do
            [ -n "${!required}" ] || fail 'a route-control credential is missing' 77
          done
          if [ "$recovery_only" != true ]; then
            for required in \
              MILK_ROUTE_SMOKE_CREDENTIAL_JSON \
              MILK_ROUTE_EVIDENCE_R2_ACCOUNT_ID MILK_ROUTE_EVIDENCE_R2_BUCKET \
              MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID \
              MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY; do
              [ -n "${!required}" ] || fail 'a route proof credential is missing' 77
            done
          fi
          [[ "$MILK_ROUTE_SECRET_HEX" =~ ^[0-9a-f]{64}$ ]] || fail 'route secret is invalid' 77

          scratch=$(mktemp -d "$RUNNER_TEMP/milk-route-control.XXXXXX")
          gateway_source=$GITHUB_WORKSPACE/milk-gateway-source
          docker_config=$scratch/docker
          gateway_config=$MILK_GATEWAY_CONFIG_PATH
          run_config=$MILK_CONFIRMED_RUN_CONFIG_PATH
          gateway_binary=$scratch/dragontales-gateway
          openssl_binary=$scratch/openssl
          signing_key=$scratch/route-signing-key.pem
          smoke_credential=$scratch/smoke-credential.json
          gateway_anchor=$scratch/gateway-anchor.json
          signer=$gateway_source/deploy/dragontales-publish-route.sh
          smoke_program=$gateway_source/tools/openai-production-smoke.mjs
          candidate_helper=$gateway_source/tools/manage-candidate-credential.py
          gateway_container_id=
          candidate_provider=
          candidate_absent=false
          candidate_operation=0
          zero_needed=false
          zero_live=false

          ghcr_username=$MILK_GHCR_PULL_USERNAME
          ghcr_token=$MILK_GHCR_PULL_TOKEN
          route_secret_hex=$MILK_ROUTE_SECRET_HEX
          signing_key_pem=$MILK_ROUTE_SIGNING_KEY_PEM
          smoke_credential_json=$MILK_ROUTE_SMOKE_CREDENTIAL_JSON
          control_access=$MILK_CONTROL_STORE_ACCESS_KEY_ID
          control_secret=$MILK_CONTROL_STORE_SECRET_ACCESS_KEY
          control_session=$MILK_CONTROL_STORE_SESSION_TOKEN
          route_access=$MILK_ROUTE_STORE_ACCESS_KEY_ID
          route_secret=$MILK_ROUTE_STORE_SECRET_ACCESS_KEY
          route_session=$MILK_ROUTE_STORE_SESSION_TOKEN
          evidence_account=$MILK_ROUTE_EVIDENCE_R2_ACCOUNT_ID
          evidence_bucket=$MILK_ROUTE_EVIDENCE_R2_BUCKET
          evidence_access=$MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID
          evidence_secret=$MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY
          evidence_session=$MILK_ROUTE_EVIDENCE_R2_SESSION_TOKEN
          modal_candidate_key=$MILK_MODAL_CANDIDATE_API_KEY
          gateway_admin_key=$MILK_GATEWAY_CONTAINER_ADMIN_KEY
          cloudflare_account_id=$CLOUDFLARE_ACCOUNT_ID
          cloudflare_candidate_token=$CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN
          unset \
            MILK_GHCR_PULL_USERNAME MILK_GHCR_PULL_TOKEN \
            MILK_GATEWAY_CONFIG_PATH MILK_ROUTE_SECRET_HEX \
            MILK_ROUTE_SIGNING_KEY_PEM MILK_ROUTE_SMOKE_CREDENTIAL_JSON \
            MILK_CONTROL_STORE_ACCESS_KEY_ID MILK_CONTROL_STORE_SECRET_ACCESS_KEY \
            MILK_CONTROL_STORE_SESSION_TOKEN MILK_ROUTE_STORE_ACCESS_KEY_ID \
            MILK_ROUTE_STORE_SECRET_ACCESS_KEY MILK_ROUTE_STORE_SESSION_TOKEN \
            MILK_ROUTE_EVIDENCE_R2_ACCOUNT_ID MILK_ROUTE_EVIDENCE_R2_BUCKET \
            MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID \
            MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY \
            MILK_ROUTE_EVIDENCE_R2_SESSION_TOKEN \
            MILK_MODAL_CANDIDATE_API_KEY MILK_GATEWAY_CONTAINER_ADMIN_KEY \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN

          mkdir -m 0700 "$docker_config" "$scratch/npm-home" "$scratch/signatures"
          printf '%s\n' "$signing_key_pem" >"$signing_key"
          if [ "$recovery_only" != true ]; then
            printf '%s\n' "$smoke_credential_json" >"$smoke_credential"
            chmod 0400 "$smoke_credential"
          fi
          chmod 0600 "$signing_key"
          signing_key_pem=
          smoke_credential_json=
          unset signing_key_pem smoke_credential_json
          env -i HOME="$scratch/npm-home" PATH=/usr/bin:/bin PYTHONPATH="$GITHUB_WORKSPACE" \
            MILK_CONTROL_STORE_ACCESS_KEY_ID="$control_access" \
            MILK_ROUTE_STORE_ACCESS_KEY_ID="$route_access" \
            MILK_ROUTE_EVIDENCE_R2_ACCOUNT_ID="$evidence_account" \
            MILK_ROUTE_EVIDENCE_R2_BUCKET="$evidence_bucket" \
            MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID="$evidence_access" \
            python3 -m milk_harness.scheduler validate-run-config \
              --phase route \
              --manifest "$run_config" \
              --confirmed-sha256 "$MILK_CONFIRMED_RUN_CONFIG_SHA256" \
              --harness-source-commit "$GITHUB_SHA" \
              --root "$GITHUB_WORKSPACE" \
              --gateway-config "$gateway_config" \
              --gateway-image "$MILK_GATEWAY_IMAGE" \
              --gateway-source-commit "$MILK_GATEWAY_SOURCE_COMMIT" \
              --gateway-image-admission-sha256 "$MILK_GATEWAY_IMAGE_ADMISSION_SHA256" \
              --gateway-release-sha256 "$MILK_GATEWAY_RELEASE_SHA256" \
              --gateway-container-application-id "$MILK_GATEWAY_CONTAINER_APPLICATION_ID" \
              --gateway-container-application-version "$MILK_GATEWAY_CONTAINER_APPLICATION_VERSION" \
              --gateway-container-image "$MILK_GATEWAY_CONTAINER_IMAGE" \
              --gateway-worker-version-id "$MILK_GATEWAY_WORKER_VERSION_ID" \
              --gateway-anchor-output "$gateway_anchor"

          gateway_env=(
            env -i
            HOME="$scratch/npm-home"
            PATH=/usr/bin:/bin
            DRAGONTALES_ROUTE_SECRET_HEX="$route_secret_hex"
            MILK_CONTROL_STORE_ACCESS_KEY_ID="$control_access"
            MILK_CONTROL_STORE_SECRET_ACCESS_KEY="$control_secret"
            MILK_ROUTE_STORE_ACCESS_KEY_ID="$route_access"
            MILK_ROUTE_STORE_SECRET_ACCESS_KEY="$route_secret"
          )
          [ -z "$control_session" ] || gateway_env+=(MILK_CONTROL_STORE_SESSION_TOKEN="$control_session")
          [ -z "$route_session" ] || gateway_env+=(MILK_ROUTE_STORE_SESSION_TOKEN="$route_session")
          evidence_env=(
            env -i
            HOME="$scratch/npm-home"
            PATH=/usr/bin:/bin
            PYTHONPATH="$GITHUB_WORKSPACE"
            MILK_ROUTE_EVIDENCE_R2_ACCOUNT_ID="$evidence_account"
            MILK_ROUTE_EVIDENCE_R2_BUCKET="$evidence_bucket"
            MILK_ROUTE_EVIDENCE_R2_ACCESS_KEY_ID="$evidence_access"
            MILK_ROUTE_EVIDENCE_R2_SECRET_ACCESS_KEY="$evidence_secret"
          )
          [ -z "$evidence_session" ] || evidence_env+=(MILK_ROUTE_EVIDENCE_R2_SESSION_TOKEN="$evidence_session")

          discard_candidate_request() {
            if [ -n "${candidate_request:-}" ] && [ -f "$candidate_request" ]; then
              chmod 0600 "$candidate_request"
              : >"$candidate_request"
            fi
          }

          prepare_candidate() {
            local preparation values status
            candidate_operation=$((candidate_operation + 1))
            candidate_request=$scratch/modal-candidate-request-$candidate_operation.json
            preparation=$scratch/modal-candidate-preparation-$candidate_operation.json
            values=$scratch/modal-candidate-values-$candidate_operation
            local arguments=(
              --student-job-id "$MILK_ROUTE_STUDENT_JOB_ID"
              --gateway-anchor "$gateway_anchor"
              --request "$candidate_request"
            )
            if "${gateway_env[@]}" timeout --signal=TERM --kill-after=10s 90s \
              "$gateway_binary" --config "$gateway_config" \
              prepare-modal-candidate-credential "${arguments[@]}" \
              >"$preparation" 2>"$preparation.stderr"; then
              status=0
            else
              status=$?
            fi
            : >"$preparation.stderr"
            if [ "$status" -ne 0 ]; then
              : >"$preparation"
              return "$status"
            fi
            if ! python3 - "$preparation" "$candidate_request" "$values" <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import sys

          preparation_name, request_name, values_name = sys.argv[1:]
          raw = Path(preparation_name).read_bytes()
          if not 1 <= len(raw) <= 1024 or not raw.endswith(b"\n"):
              raise SystemExit("invalid candidate preparation output")
          value = json.loads(raw)
          if (
              list(value) != ["schema_version", "selected_provider", "action", "request_sha256"]
              or value["schema_version"] != "dragontales.modal-candidate-credential-preparation.v1"
              or value["selected_provider"] not in {"baseten", "modal"}
              or value["action"] not in {"install", "verify", "ready", "remove", "absent"}
              or json.dumps(value, separators=(",", ":")).encode() + b"\n" != raw
          ):
              raise SystemExit("candidate preparation output differs")
          action = value["action"]
          digest = value["request_sha256"]
          has_request = action in {"install", "verify", "remove"}
          if value["selected_provider"] == "baseten" and action != "ready":
              raise SystemExit("Baseten candidate is not ready")
          if has_request:
              path = Path(request_name)
              metadata = path.lstat()
              request = path.read_bytes()
              if (
                  not stat.S_ISREG(metadata.st_mode)
                  or path.is_symlink()
                  or metadata.st_uid != os.getuid()
                  or metadata.st_nlink != 1
                  or stat.S_IMODE(metadata.st_mode) != 0o400
                  or not 1 <= len(request) <= 65_536
                  or re.fullmatch(r"[0-9a-f]{64}", digest or "") is None
                  or hashlib.sha256(request).hexdigest() != digest
              ):
                  raise SystemExit("candidate request differs from gateway preparation")
          elif digest is not None or os.path.lexists(request_name):
              raise SystemExit("candidate no-op produced request authority")
          Path(values_name).write_text(
              f'{value["selected_provider"]}\t{action}\t{digest or ""}\n',
              encoding="utf-8",
          )
          PY
            then
              : >"$preparation"
              return 65
            fi
            IFS=$'\t' read -r prepared_provider candidate_action candidate_request_sha256 <"$values"
            : >"$preparation"
            : >"$values"
          }

          run_candidate_helper() {
            local action=$1 ack helper_stdout helper_stderr ingest_stdout ingest_stderr status
            [ "$prepared_provider" = modal ] || return 64
            [[ "$action" =~ ^(install|verify|remove)$ ]] || return 64
            [ -n "$cloudflare_account_id" ] || return 77
            [ -n "$cloudflare_candidate_token" ] || return 77
            [ -n "$gateway_admin_key" ] || return 77
            if [ "$action" = install ] && [ -z "$modal_candidate_key" ]; then
              return 77
            fi
            ack=$scratch/modal-candidate-ack-$candidate_operation.json
            helper_stdout=$ack
            helper_stderr=$scratch/modal-candidate-helper-$candidate_operation.stderr
            ingest_stdout=$scratch/modal-candidate-ingest-$candidate_operation.json
            ingest_stderr=$scratch/modal-candidate-ingest-$candidate_operation.stderr
            local arguments=(
              "${action}-modal"
              --request "$candidate_request"
              --admin-key-fd 3
            )
            if [ "$action" = install ]; then
              arguments+=(--candidate-key-fd 4)
              if env -i \
                HOME="$scratch/npm-home" \
                PATH="$candidate_helper_path" \
                CLOUDFLARE_ACCOUNT_ID="$cloudflare_account_id" \
                CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN="$cloudflare_candidate_token" \
                timeout --signal=TERM --kill-after=10s 600s \
                python3 "$candidate_helper" "${arguments[@]}" \
                3< <(printf '%s' "$gateway_admin_key") \
                4< <(printf '%s' "$modal_candidate_key") \
                >"$helper_stdout" 2>"$helper_stderr"; then
                status=0
              else
                status=$?
              fi
            elif env -i \
              HOME="$scratch/npm-home" \
              PATH="$candidate_helper_path" \
              CLOUDFLARE_ACCOUNT_ID="$cloudflare_account_id" \
              CLOUDFLARE_CANDIDATE_SECRET_API_TOKEN="$cloudflare_candidate_token" \
              timeout --signal=TERM --kill-after=10s 600s \
              python3 "$candidate_helper" "${arguments[@]}" \
              3< <(printf '%s' "$gateway_admin_key") \
              >"$helper_stdout" 2>"$helper_stderr"; then
              status=0
            else
              status=$?
            fi
            : >"$helper_stderr"
            if [ "$status" -ne 0 ]; then
              [ ! -e "$helper_stdout" ] || : >"$helper_stdout"
              return "$status"
            fi
            chmod 0600 "$ack"
            if "${gateway_env[@]}" timeout --signal=TERM --kill-after=10s 90s \
              "$gateway_binary" --config "$gateway_config" \
              ingest-modal-candidate-credential-ack \
                --student-job-id "$MILK_ROUTE_STUDENT_JOB_ID" \
                --acknowledgement "$ack" \
              >"$ingest_stdout" 2>"$ingest_stderr"; then
              status=0
            else
              status=$?
            fi
            : >"$ingest_stderr"
            if [ "$status" -eq 0 ]; then
              if python3 - "$ingest_stdout" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          raw = Path(sys.argv[1]).read_bytes()
          value = json.loads(raw)
          if (
              not 1 <= len(raw) <= 2048
              or not raw.endswith(b"\n")
              or list(value) != ["schema_version", "state", "object_key", "sha256"]
              or value["schema_version"] != "dragontales.modal-candidate-credential-ack-write.v1"
              or value["state"] not in {"installed", "absent"}
              or not isinstance(value["object_key"], str)
              or not value["object_key"].endswith("-ack.json")
              or re.fullmatch(r"[0-9a-f]{64}", value["sha256"] or "") is None
              or json.dumps(value, separators=(",", ":")).encode() + b"\n" != raw
          ):
              raise SystemExit("candidate acknowledgement write differs")
          PY
              then
                status=0
              else
                status=$?
              fi
            fi
            : >"$ack"
            : >"$ingest_stdout"
            discard_candidate_request
            return "$status"
          }

          reconcile_candidate() {
            local target=$1 iteration
            for iteration in $(seq 1 8); do
              prepare_candidate || return
              if [ -z "$candidate_provider" ]; then
                candidate_provider=$prepared_provider
              elif [ "$candidate_provider" != "$prepared_provider" ]; then
                return 70
              fi
              if [ "$prepared_provider" = baseten ]; then
                [ "$candidate_action" = ready ] || return 70
                if [ "$target" = ready ]; then
                  [ "$MILK_ROUTE_CANDIDATE_READY" = true ] || return 70
                else
                  [ "$target" = absent ] || return 70
                  candidate_absent=true
                fi
                return
              fi
              if [ "$candidate_action" = "$target" ]; then
                [ "$target" != absent ] || candidate_absent=true
                return 0
              fi
              if [ "$target" = ready ]; then
                [[ "$candidate_action" =~ ^(install|verify)$ ]] || return 70
              else
                [[ "$candidate_action" =~ ^(remove|verify)$ ]] || return 70
              fi
              run_candidate_helper "$candidate_action" || return
            done
            return 70
          }

          advance_phase() {
            local phase=$1 manifest=$2 output=$3 values=$4 status
            [ ! -e "$manifest" ] && [ ! -L "$manifest" ] || return 64
            if "${gateway_env[@]}" timeout --signal=TERM --kill-after=10s 90s \
              "$gateway_binary" --config "$gateway_config" \
              advance-winner-route \
                --student-job-id "$MILK_ROUTE_STUDENT_JOB_ID" \
                --phase "$phase" \
                --manifest "$manifest" \
              >"$output" 2>"$output.stderr"; then
              status=0
            else
              status=$?
            fi
            : >"$output.stderr"
            [ "$status" -eq 0 ] || return "$status"
            if python3 - "$phase" "$manifest" "$output" "$values" <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          import re
          import sys

          phase, manifest_name, output_name, values_name = sys.argv[1:]
          raw = Path(output_name).read_bytes()
          if not 1 <= len(raw) <= 4096 or not raw.endswith(b"\n"):
              raise SystemExit("invalid route advance output")
          def pairs(items):
              value = {}
              for key, item in items:
                  if key in value:
                      raise ValueError("duplicate key")
                  value[key] = item
              return value
          value = json.loads(raw, object_pairs_hook=pairs, parse_constant=lambda item: (_ for _ in ()).throw(ValueError(item)))
          if list(value) != ["schema_version", "action", "route_revision", "not_after"]:
              raise SystemExit("invalid route advance fields")
          allowed = {"canary": {"prepare", "observe", "done"}, "zero": {"prepare", "done"}}
          if (
              value["schema_version"] != "dragontales.winner-route-advance.v1"
              or value["action"] not in allowed[phase]
              or re.fullmatch(r"[0-9a-f]{64}", value["route_revision"] or "") is None
              or re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z", value["not_after"] or "") is None
          ):
              raise SystemExit("invalid route advance value")
          dt.datetime.fromisoformat(value["not_after"][:-1] + "+00:00")
          manifest = Path(manifest_name)
          if value["action"] == "prepare":
              metadata = manifest.lstat()
              if not manifest.is_file() or manifest.is_symlink() or metadata.st_uid != os.getuid() or metadata.st_size > 65_536:
                  raise SystemExit("invalid prepared route manifest")
          elif manifest.exists() or manifest.is_symlink():
              raise SystemExit("unexpected route manifest")
          Path(values_name).write_text(
              f'{value["action"]}\t{value["route_revision"]}\t{value["not_after"]}\n',
              encoding="utf-8",
          )
          PY
            then
              validation_status=0
            else
              validation_status=$?
            fi
            : >"$output"
            [ "$validation_status" -eq 0 ] || return "$validation_status"
          }

          publish_manifest() {
            local manifest=$1 signature=$2 receipt=$3 status
            chmod 0400 "$manifest"
            if "${gateway_env[@]}" timeout --signal=TERM --kill-after=10s 180s \
              bash "$signer" \
                "$gateway_binary" "$openssl_binary" "$gateway_config" \
                "$manifest" "$signature" "$signing_key" \
              >"$receipt" 2>"$receipt.stderr"; then
              status=0
            else
              status=$?
            fi
            : >"$receipt"
            : >"$receipt.stderr"
            return "$status"
          }

          read_advance() {
            local values=$1
            IFS=$'\t' read -r advance_action advance_revision advance_not_after <"$values"
            [ -n "$advance_action" ] && [ -n "$advance_revision" ] && [ -n "$advance_not_after" ]
          }

          validate_canary_selection() {
            local manifest=$1 revision=$2 not_after=$3
            env -i PATH=/usr/bin:/bin MILK_ROUTE_SECRET_HEX="$route_secret_hex" \
              python3 - "$manifest" "$smoke_credential" "$gateway_config" \
                "$MILK_ROUTE_STUDENT_JOB_ID" "$revision" "$not_after" <<'PY'
          import hashlib
          import hmac
          import json
          from pathlib import Path
          import re
          import sys
          import os

          manifest_path, credential_path, config_path, student_job_id, revision, not_after = sys.argv[1:]
          manifest_raw = Path(manifest_path).read_bytes()
          manifest = json.loads(manifest_raw)
          credential_raw = Path(credential_path).read_bytes()
          credential = json.loads(credential_raw)
          config = json.loads(Path(config_path).read_bytes())
          if hashlib.sha256(manifest_raw).hexdigest() != revision:
              raise SystemExit("route revision differs")
          if (
              manifest.get("student_job_id") != student_job_id
              or manifest.get("candidate_basis_points") != 100
              or manifest.get("previous_route_revision") is not None
              or manifest.get("not_after") != not_after
              or manifest.get("winner_admission", {}).get("model_alias") != credential.get("model")
              or manifest.get("reasoning_effort") != credential.get("reasoning_effort")
          ):
              raise SystemExit("canary differs from smoke identity")
          secret_hex = os.environ["MILK_ROUTE_SECRET_HEX"]
          secret = bytes.fromhex(secret_hex)
          if manifest.get("route_secret_sha256") != hashlib.sha256(secret).hexdigest():
              raise SystemExit("route secret differs")
          api_key = credential.get("api_key")
          cohort_id = credential.get("cohort_id")
          if not isinstance(api_key, str) or not isinstance(cohort_id, str):
              raise SystemExit("smoke credential is invalid")
          matches = [
              item for item in config.get("traffic_keys", [])
              if item == {
                  "api_key_sha256": hashlib.sha256(api_key.encode()).hexdigest(),
                  "capture_allowed": False,
                  "cohort_id": cohort_id,
              }
          ]
          if len(matches) != 1:
              raise SystemExit("smoke credential is not an admitted traffic key")
          cohort_sha256 = manifest.get("cohort_sha256")
          if re.fullmatch(r"[0-9a-f]{64}", cohort_sha256 or "") is None:
              raise SystemExit("route cohort is invalid")
          sample = int.from_bytes(
              hmac.digest(secret, bytes.fromhex(cohort_sha256) + cohort_id.encode(), "sha256")[:8],
              "big",
          )
          if sample >= 100 * (1 << 64) // 10_000:
              raise SystemExit("smoke traffic key is outside the one-percent canary")
          PY
          }

          proof_evidence() {
            local kind=$1 mode=$2 revision=${3:-} receipt=${4:-}
            "${evidence_env[@]}" python3 - "$kind" "$mode" "$MILK_ROUTE_STUDENT_JOB_ID" \
              "$revision" "$receipt" "$smoke_credential" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import re
          import sys
          from milk_harness.evidence import R2EvidenceStore, canonical_json, create_same

          kind, mode, student_job_id, revision, receipt_name, credential_name = sys.argv[1:]
          if kind not in {"candidate", "saturation"}:
              raise ValueError("route proof kind is invalid")
          digest = re.compile(r"[0-9a-f]{64}\Z")
          if digest.fullmatch(student_job_id) is None:
              raise SystemExit("invalid smoke student job identity")
          credential_raw = Path(credential_name).read_bytes()
          credential = json.loads(credential_raw)
          if kind == "candidate":
              request = {
                  "messages": [{"role": "user", "content": "Reply with only OK."}],
                  "model": credential["model"],
              }
              prefix = f"route-smokes/v1/{student_job_id}"
              intent_prefix = f"route-smoke-intents/v1/{student_job_id}"
              intent_schema = "milk.official-openai-sdk-route-smoke-intent.v1"
          else:
              request = {
                  "messages": [{
                      "role": "user",
                      "content": "Write OK on 4096 separate lines. Do not summarize or stop early.",
                  }],
                  "model": credential["model"],
                  "stream": True,
              }
              prefix = f"route-saturation-fallback-smokes/v1/{student_job_id}"
              intent_prefix = f"route-saturation-fallback-smoke-intents/v1/{student_job_id}"
              intent_schema = "milk.official-openai-sdk-saturation-fallback-smoke-intent.v1"
          if credential["reasoning_effort"] is not None:
              request["reasoning_effort"] = credential["reasoning_effort"]
          expected = {
              "endpoint_sha256": hashlib.sha256(b"https://api.dragontales.milkinfrastructure.com/v1").hexdigest(),
              "request_sha256": hashlib.sha256(json.dumps(request, sort_keys=True, separators=(",", ":")).encode()).hexdigest(),
              "traffic_cohort_sha256": hashlib.sha256(credential["cohort_id"].encode()).hexdigest(),
              "traffic_key_sha256": hashlib.sha256(credential["api_key"].encode()).hexdigest(),
          }
          def validate(raw, expected_revision):
              value = json.loads(raw)
              common = (
                  value.get("authenticated") is True
                  and value.get("content_retained") is False
                  and value.get("route_revision") == expected_revision
                  and value.get("sdk") == "openai-node"
                  and value.get("sdk_version") == "6.33.0"
                  and value.get("succeeded") is True
                  and all(value.get(field) == item for field, item in expected.items())
              )
              if canonical_json(value) != raw:
                  raise ValueError("route smoke receipt is not canonical")
              if kind == "candidate":
                  keys = {
                      "artifact_sha256", "authenticated", "candidate_sha256", "choice_count",
                      "content_retained", "deployment_sha256", "endpoint_sha256", "finish_reason",
                      "http_status", "request_sha256", "response_bytes", "response_sha256",
                      "route_revision", "route_target", "schema_version", "sdk", "sdk_version",
                      "succeeded", "traffic_cohort_sha256", "traffic_key_sha256",
                  }
                  valid = (
                      value.get("schema_version") == "milk.official-openai-sdk-route-smoke.v1"
                      and value.get("choice_count") == 1
                      and value.get("http_status") == 200
                      and type(value.get("response_bytes")) is int
                      and 1 <= value["response_bytes"] <= 65_536
                      and isinstance(value.get("finish_reason"), str)
                      and 1 <= len(value["finish_reason"]) <= 64
                      and value.get("route_target") == "candidate"
                      and digest.fullmatch(value.get("response_sha256") or "") is not None
                  )
              else:
                  keys = {
                      "artifact_sha256", "authenticated", "candidate_http_status",
                      "candidate_route_target", "candidate_sha256", "content_retained",
                      "deployment_sha256", "endpoint_sha256", "fallback_http_status",
                      "fallback_route_target", "request_sha256", "route_revision",
                      "schema_version", "sdk", "sdk_version", "succeeded",
                      "traffic_cohort_sha256", "traffic_key_sha256",
                  }
                  valid = (
                      value.get("schema_version")
                      == "milk.official-openai-sdk-saturation-fallback-smoke.v1"
                      and value.get("candidate_http_status") == 200
                      and value.get("candidate_route_target") == "candidate"
                      and value.get("fallback_http_status") == 200
                      and value.get("fallback_route_target") == "openai"
                  )
              if (
                  set(value) != keys
                  or not common
                  or not valid
                  or any(
                      digest.fullmatch(value.get(field) or "") is None
                      for field in ("artifact_sha256", "candidate_sha256", "deployment_sha256")
                  )
              ):
                  raise ValueError("route smoke receipt differs")
              return value
          store = R2EvidenceStore.from_environment("MILK_ROUTE_EVIDENCE_R2_")
          if mode == "require-any":
              found = store.list(prefix, limit=2)
              if len(found) != 1 or not found[0].startswith(prefix + "/") or not found[0].endswith(".json"):
                  raise ValueError("one prior route smoke receipt is required")
              found_revision = found[0][len(prefix) + 1:-5]
              if digest.fullmatch(found_revision) is None:
                  raise ValueError("prior route smoke revision is invalid")
              validate(store.get(found[0]), found_revision)
              raise SystemExit(0)
          if digest.fullmatch(revision) is None:
              raise ValueError("route smoke revision is invalid")
          key = f"{prefix}/{revision}.json"
          if mode == "check":
              try:
                  raw = store.get(key)
              except FileNotFoundError:
                  raise SystemExit(3)
              validate(raw, revision)
              raise SystemExit(0)
          intent = {
              "endpoint_sha256": expected["endpoint_sha256"],
              "request_sha256": expected["request_sha256"],
              "route_revision": revision,
              "schema_version": intent_schema,
              "student_job_id": student_job_id,
              "traffic_cohort_sha256": expected["traffic_cohort_sha256"],
              "traffic_key_sha256": expected["traffic_key_sha256"],
          }
          if mode == "reserve":
              outcome = create_same(
                  store,
                  f"{intent_prefix}/{revision}.json",
                  canonical_json(intent),
                  "application/json",
              )
              raise SystemExit(0 if outcome == "created" else 4)
          if mode != "store":
              raise ValueError("route smoke evidence mode is invalid")
          raw = Path(receipt_name).read_bytes()
          validate(raw, revision)
          create_same(store, key, raw, "application/json")
          if store.get(key) != raw:
              raise ValueError("route smoke receipt read-back differs")
          PY
          }

          seconds_until() {
            python3 - "$1" <<'PY'
          import datetime as dt
          import math
          import sys
          deadline = dt.datetime.fromisoformat(sys.argv[1][:-1] + "+00:00")
          print(max(0, math.ceil((deadline - dt.datetime.now(dt.timezone.utc)).total_seconds())))
          PY
          }

          force_zero() {
            local zero_scratch
            zero_scratch=$(mktemp -d "$scratch/zero.XXXXXX") || return
            local manifest=$zero_scratch/manifest.json
            local output=$zero_scratch/advance.json
            local values=$zero_scratch/values
            local verify_manifest=$zero_scratch/verify-manifest.json
            local verify_output=$zero_scratch/verify.json
            local verify_values=$zero_scratch/verify-values
            advance_phase zero "$manifest" "$output" "$values" || return
            read_advance "$values" || return
            local action=$advance_action revision=$advance_revision not_after=$advance_not_after
            if [ "$action" = prepare ]; then
              publish_manifest "$manifest" "$zero_scratch/signature.bin" "$zero_scratch/publish.json" || return
              advance_phase zero "$verify_manifest" "$verify_output" "$verify_values" || return
              read_advance "$verify_values" || return
              [ "$advance_action" = done ] || return 70
              [ "$advance_revision" = "$revision" ] || return 70
              [ "$advance_not_after" = "$not_after" ] || return 70
            elif [ "$action" != done ]; then
              return 70
            fi
            zero_live=true
            printf 'zero_published=true\n' >>"$GITHUB_OUTPUT"
            printf 'zero_route_revision=%s\n' "$revision" >>"$GITHUB_OUTPUT"
          }

          cleanup() {
            local status=$?
            trap - EXIT HUP INT TERM
            set +e
            if [ "$zero_needed" = true ] && [ "$zero_live" != true ]; then
