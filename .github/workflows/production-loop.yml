          fi
          : >"$scratch/npm-stdout"
          : >"$scratch/npm-stderr"
          candidate_helper_path="$gateway_source/deploy/cloudflare/node_modules/.bin:$(dirname "$(command -v node)"):$(dirname "$(command -v python3)"):$(dirname "$(command -v curl)"):$(dirname "$(command -v sleep)"):/usr/bin:/bin"

