name: Sync Baseten registry credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milk-sync-baseten-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: milk-provider-jobs-prod
    env:
      BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
      MILK_GHCR_PULL_USERNAME: ${{ secrets.MILK_GHCR_PULL_USERNAME }}
      MILK_GHCR_PULL_TOKEN: ${{ secrets.MILK_GHCR_PULL_TOKEN }}
    steps:
      - name: Upsert and verify registry credentials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [ -n "$BASETEN_API_KEY" ]
          [ -n "$MILK_GHCR_PULL_USERNAME" ]
          [ -n "$MILK_GHCR_PULL_TOKEN" ]

          scratch=$(mktemp -d "$RUNNER_TEMP/milk-baseten-registry.XXXXXX")
          cleanup() {
            case "$scratch" in
              "$RUNNER_TEMP"/milk-baseten-registry.*) rm -rf -- "$scratch" ;;
            esac
          }
          trap cleanup EXIT HUP INT TERM

          credential=$MILK_GHCR_PULL_USERNAME:$MILK_GHCR_PULL_TOKEN
          for name in milk-prod-ghcr DOCKER_REGISTRY_ghcr.io; do
            NAME=$name VALUE=$credential python3 - <<'PY' >"$scratch/request.json"
          import json
          import os

          print(json.dumps({"name": os.environ["NAME"], "value": os.environ["VALUE"]}))
          PY
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url https://api.baseten.co/v1/secrets \
              --header "Authorization: Api-Key $BASETEN_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary @"$scratch/request.json" \
              >"$scratch/$name.json"
          done

          curl --fail-with-body --silent --show-error \
            --url https://api.baseten.co/v1/secrets \
            --header "Authorization: Api-Key $BASETEN_API_KEY" \
            >"$scratch/secrets.json"

          SCRATCH=$scratch python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SCRATCH"])
          expected = {"milk-prod-ghcr", "DOCKER_REGISTRY_ghcr.io"}
          responses = {json.loads((root / f"{name}.json").read_text())["name"] for name in expected}
          listed = {item["name"] for item in json.loads((root / "secrets.json").read_text())["secrets"]}
          if responses != expected or not expected <= listed:
              raise SystemExit("Baseten registry credential verification failed")
          PY

          unset credential MILK_GHCR_PULL_USERNAME MILK_GHCR_PULL_TOKEN BASETEN_API_KEY
